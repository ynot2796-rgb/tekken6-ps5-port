name: Reused PS5 graphics and DualSense probe

on:
  workflow_dispatch:
  push:
    branches: ["port/initial-scaffold"]
    paths:
      - ".github/workflows/native-ps5-render-input-probe.yml"
      - "docs/PS5_GRAPHICS_INPUT_INTEGRATION_AUDIT.md"

permissions:
  contents: read

jobs:
  build-render-input-probe:
    # RADV is a large native dependency; allow a full clean build.
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout Tekken port
        uses: actions/checkout@v4

      - name: Checkout proven PS5 Vulkan title foundation at a fixed commit
        uses: actions/checkout@v4
        with:
          repository: mihawk-99/PS5_VulkanTemplate
          ref: 91179df760df1e6c6f2d4d172bc435319d79ff3c
          path: PS5_VulkanTemplate
          submodules: recursive

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang-18 lld-18 cmake ninja-build meson glslang-tools rsync curl zstd git python3-pip python3-numpy python3-pil python3-mako
          clang-18 --version
          glslangValidator --version

      - name: Bootstrap the pinned PS5 graphics/runtime stack
        working-directory: PS5_VulkanTemplate
        run: |
          # Bootstrap expects the console address to exist, but this workflow only builds.
          mkdir -p ../PS5_Vulkan/.env-placeholder
          bash ps5/tools/bootstrap.sh

      - name: Generate a Tekken-labelled visible graphics and controller probe
        working-directory: PS5_VulkanTemplate
        run: |
          python3 ps5/tools/new-title.py ../t6-render-input-probe --title-id PPSA99873 --name "Tekken 6 Port Probe" --refresh 60
          test -s ../t6-render-input-probe/ps5/tools/build.sh
          test -s ../t6-render-input-probe/examples/starter/main.cpp || find ../t6-render-input-probe/examples -maxdepth 2 -type f | head -80

      - name: Build native title
        working-directory: t6-render-input-probe
        run: |
          bash ps5/tools/build.sh
          test -s dist/PPSA99873/eboot.bin
          test -s dist/PPSA99873/sce_sys/param.json

      - name: Package native title for console testing
        run: |
          cd t6-render-input-probe/dist
          zip -qr PPSA99873.zip PPSA99873
          sha256sum PPSA99873.zip | tee PPSA99873.zip.sha256
          test -s PPSA99873.zip

      - name: Upload native probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tekken6-PS5-render-input-probe
          path: |
            t6-render-input-probe/dist/PPSA99873.zip
            t6-render-input-probe/dist/PPSA99873.zip.sha256
          if-no-files-found: error
          retention-days: 14
