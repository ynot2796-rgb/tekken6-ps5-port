name: ReXGlue Prospero patch tests

on:
  push:
    branches: ["port/initial-scaffold"]
    paths:
      - "tools/patch_rexglue_prospero_cmake.py"
      - "tests/test_patch_rexglue_prospero_cmake.py"
      - "tools/prepare_ps5_game_source.sh"
      - ".github/workflows/rexglue-prospero-patch-tests.yml"
  pull_request:
    paths:
      - "tools/patch_rexglue_prospero_cmake.py"
      - "tests/test_patch_rexglue_prospero_cmake.py"
      - "tools/prepare_ps5_game_source.sh"
      - ".github/workflows/rexglue-prospero-patch-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-prospero-cmake-patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run guarded CMake patch regression tests
        run: python3 -m unittest discover -s tests -p 'test_patch_rexglue_prospero_cmake.py' -v
